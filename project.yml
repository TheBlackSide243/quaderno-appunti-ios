name: Appunti
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Appunti:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.appunti
        PRODUCT_NAME: Appunti
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AppuntiTests
        - AppuntiUITests
  AppuntiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
        excludes:
          - "Fixtures/**"
      - path: UnitTests/Fixtures/sample.goodnotes
        buildPhase: resources
    dependencies:
      - target: Appunti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.appunti.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Appunti.app/Appunti"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AppuntiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Appunti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.appunti.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Appunti
