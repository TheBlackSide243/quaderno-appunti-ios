name: Appunti
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "20"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # the app's bundle id; the widgets' is the same with .widgets (TestFlight sets its own)
    APP_ID: com.local.appunti
targets:
  Appunti:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: AppuntiWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        PRODUCT_NAME: Appunti
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AppuntiTests
        - AppuntiUITests
  AppuntiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widgets
        PRODUCT_NAME: AppuntiWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  AppuntiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
        excludes:
          - "Fixtures/**"
      - path: UnitTests/Fixtures/sample.goodnotes
        buildPhase: resources
    dependencies:
      - target: Appunti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.appunti.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Appunti.app/Appunti"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AppuntiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Appunti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.appunti.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Appunti
